name: Shell tests

on:
  push:
  pull_request:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: v2.2 policy tests
        run: bash tests/test_v22_policy.sh

      - name: v2.3 dynamic DNS tests
        run: bash tests/test_v23_dynamic.sh

      - name: v2.4 backend tests
        run: bash tests/test_v24_backend.sh

      - name: v2.4.3 install and upgrade tests
        run: bash tests/test_v243_install.sh
